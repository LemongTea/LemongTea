name: Update Profile Collaborators

on:
  workflow_dispatch:

  schedule:
    # Setiap hari pukul 07:15 WIB
    - cron: "15 0 * * *"

permissions:
  contents: write

concurrency:
  group: update-profile-collaborators
  cancel-in-progress: true

jobs:
  update-collaborators:
    name: Update collaborators
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate collaborator cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: LemongTea
          MAX_COLLABORATORS: 12
        run: node scripts/update-contributors.mjs

      - name: Commit README changes
        run: |
          if git diff --quiet -- README.md; then
            echo "No collaborator changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "chore: update profile collaborators"
          git push